<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pn-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4cc7a"/>
      <stop offset="1" stop-color="#8a7434"/>
