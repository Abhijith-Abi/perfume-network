<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2110"/>
      <stop offset="1" stop-color="#0c0905"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.32" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6218"/>
      <stop offset="1" stop-color="#3a2a0c"/>
    </linearGradient>
    <linearGradient id="glassSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#spot)"/>
  <!-- reflection floor -->
  <ellipse cx="300" cy="520" rx="150" ry="26" fill="#000000" opacity="0.28"/>

  <!-- cap -->
  <rect x="259" y="120" width="82" height="60" rx="8" fill="#e4cc7a"/>
  <rect x="259" y="120" width="82" height="60" rx="8" fill="url(#glassSheen)"/>
  <!-- neck -->
  <rect x="273" y="178" width="54" height="63" fill="#3a2a0c" opacity="0.9"/>

  <!-- bottle body -->
  <rect x="200" y="235" width="200" height="250" rx="26"
        fill="url(#liquid)" stroke="#4e3c18" stroke-width="3"/>
  <!-- glass sheen -->
  <rect x="200" y="235" width="200" height="250" rx="26" fill="url(#glassSheen)"/>
  <!-- highlight strip -->
  <rect x="216" y="255" width="14" height="190" rx="7" fill="#ffffff" opacity="0.18"/>

  <!-- label -->
  <rect x="230" y="318" width="140" height="84" rx="6"
        fill="#0c0b09" opacity="0.55"/>
  <rect x="230" y="318" width="140" height="84" rx="6"
        fill="none" stroke="#f0dca0" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="300" y="354" text-anchor="middle"
        font-family="Georgia, 'Cormorant Garamond', serif" font-size="26" font-style="italic"
        fill="#f0dca0">Naxos</text>
  <text x="300" y="384" text-anchor="middle"
        font-family="'DM Sans', Arial, sans-serif" font-size="10" letter-spacing="3"
        fill="#f0dca0" opacity="0.8">EAU DE PARFUM</text>
</svg>