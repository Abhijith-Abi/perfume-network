<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1220"/>
      <stop offset="1" stop-color="#08050c"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.32" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e1a38"/>
      <stop offset="1" stop-color="#140b1a"/>
    </linearGradient>
    <linearGradient id="glassSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#spot)"/>
  <!-- reflection floor -->
  <ellipse cx="300" cy="520" rx="150" ry="26" fill="#000000" opacity="0.28"/>

  <!-- cap -->
  <rect x="256" y="120" width="88" height="60" rx="8" fill="#caa24a"/>
  <rect x="256" y="120" width="88" height="60" rx="8" fill="url(#glassSheen)"/>
  <!-- neck -->
  <rect x="270" y="178" width="60" height="78" fill="#140b1a" opacity="0.9"/>

  <!-- bottle body -->
  <rect x="185" y="250" width="230" height="230" rx="60"
        fill="url(#liquid)" stroke="#3a2440" stroke-width="3"/>
  <!-- glass sheen -->
  <rect x="185" y="250" width="230" height="230" rx="60" fill="url(#glassSheen)"/>
  <!-- highlight strip -->
  <rect x="201" y="270" width="14" height="170" rx="7" fill="#ffffff" opacity="0.18"/>

  <!-- label -->
  <rect x="230" y="323" width="140" height="84" rx="6"
        fill="#0c0b09" opacity="0.55"/>
  <rect x="230" y="323" width="140" height="84" rx="6"
        fill="none" stroke="#d0a8e0" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="300" y="359" text-anchor="middle"
        font-family="Georgia, 'Cormorant Garamond', serif" font-size="26" font-style="italic"
        fill="#d0a8e0">Orchid</text>
  <text x="300" y="389" text-anchor="middle"
        font-family="'DM Sans', Arial, sans-serif" font-size="10" letter-spacing="3"
        fill="#d0a8e0" opacity="0.8">EAU DE PARFUM</text>
</svg>