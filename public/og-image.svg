<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161411"/>
      <stop offset="1" stop-color="#0c0b09"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a7434"/>
      <stop offset="0.5" stop-color="#e4cc7a"/>
      <stop offset="1" stop-color="#8a7434"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#c9a84c" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="30" y="30" width="1140" height="570" rx="6" fill="none" stroke="#c9a84c" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- eyebrow -->
  <text x="100" y="250" font-family="'DM Sans', Arial, sans-serif" font-size="24" letter-spacing="8" fill="#c9a84c">CURATED LUXURY FRAGRANCES</text>

  <!-- brand -->
  <text x="98" y="345" font-family="Georgia, 'Cormorant Garamond', serif" font-size="92" fill="#f0ece4">Perfume Network</text>

  <!-- divider -->
  <rect x="100" y="380" width="120" height="2" fill="url(#gold)"/>

  <!-- tagline -->
  <text x="100" y="440" font-family="Georgia, 'Cormorant Garamond', serif" font-size="34" font-style="italic" fill="#b8b0a2">Discover Your Signature Scent</text>

  <!-- bottle motif -->
  <g transform="translate(940 315)" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="-28" y="-150" width="56" height="40" rx="6" fill="url(#gold)" stroke="none"/>
    <path d="M-16 -110h32v26h-32z" fill="url(#gold)" stroke="none"/>
    <path d="M-58 -84c-18 12 -30 30 -30 70v70a34 34 0 0 0 34 34h108a34 34 0 0 0 34 -34v-70c0-40 -12 -58 -30 -70z"/>
    <text x="0" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="60" font-style="italic" fill="#c9a84c" stroke="none">PN</text>
  </g>
</svg>
